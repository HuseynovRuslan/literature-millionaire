# Production deployment stack for the "Ayın kitabı" kiosk.
# Run everything from here with:
#   docker compose --env-file deploy/.env -f deploy/compose.yml <command>
# (or `cd deploy && docker compose ...` - compose.yml resolves build contexts relative to
# its own location). See deploy/README.md for the full walkthrough.
#
# Public traffic reaches this stack through an existing reverse proxy that runs in its own
# container on the VPS (the QRLog stack's Caddy, which terminates HTTPS). That proxy joins the
# external "shared-proxy" network and forwards to literature-millionaire-web:80. Nothing in this
# file or in the images names a domain or an IP.

name: literature-millionaire

networks:
  # Private to this project. db, migrate and api are ONLY on this network and publish no host
  # port at all - nothing outside this stack can reach them.
  internal:
    driver: bridge

  # Pre-existing network owned by the VPS's reverse proxy (created by another stack, never by
  # this one - `external: true` makes Compose refuse to start instead of creating it). Only
  # "web" joins it, under a project-unique alias, so the proxy can reach Nginx while the API
  # and the database stay invisible to every other project on that shared network.
  shared-proxy:
    external: true
    name: ${SHARED_PROXY_NETWORK:?SHARED_PROXY_NETWORK must be set in deploy/.env}

volumes:
  postgres-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Admin/bootstrap credential, used only once by the init script below to create the
      # application role and database - the app itself never connects as this user.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      # Read by deploy/db/init/01-init-app-role-and-db.sh on first volume creation.
      APP_DB_NAME: ${APP_DB_NAME:?APP_DB_NAME must be set in deploy/.env}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER must be set in deploy/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    # No `ports:` here on purpose - PostgreSQL is never reachable from the host, only from
    # other containers on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # One-shot: applies EF Core migrations and runs the seed, then exits. The "api" service
  # below only starts once this has exited 0 (depends_on: service_completed_successfully),
  # so the production HTTP server never comes up against an unmigrated database.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: literature-millionaire-api:${IMAGE_TAG:-local}
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${APP_DB_NAME:?APP_DB_NAME must be set in deploy/.env};Username=${APP_DB_USER:?APP_DB_USER must be set in deploy/.env};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in deploy/.env}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: literature-millionaire-api:${IMAGE_TAG:-local}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${APP_DB_NAME:?APP_DB_NAME must be set in deploy/.env};Username=${APP_DB_USER:?APP_DB_USER must be set in deploy/.env};Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set in deploy/.env}
      # Shared with QRLog, which signs "QRLog ilə davam et" confirmations with it. Optional: left
      # empty, the button is still shown but every confirmation is refused, so set it before
      # announcing the feature. Must be the same value on both sides.
      QrLog__VouchSecret: ${QRLOG_VOUCH_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      internal:
        # Project-unique name the web container's Nginx proxies to. A generic "api" could
        # collide with another project's container if this stack ever shares a network.
        aliases:
          - literature-millionaire-api
    # No `ports:` here on purpose - the API is reachable only via the "web" (Nginx)
    # container's allowlisted proxy, never directly from the host or the internet.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: literature-millionaire-web:${IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal: {}
      shared-proxy:
        # The reverse proxy's upstream: literature-millionaire-web:80.
        aliases:
          - literature-millionaire-web
    ports:
      # Local verification and emergency diagnostics on the VPS itself only - bound to
      # loopback, never 0.0.0.0. Public traffic arrives over shared-proxy, not this port.
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    logging: *default-logging
