# Shared proxy headers for every backend-proxying location in nginx.conf.
# Not under conf.d/ (nginx would try to auto-include it as a server block); referenced
# explicitly via `include /etc/nginx/proxy_params.conf;` instead.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
