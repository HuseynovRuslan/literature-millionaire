# Production Nginx config for the kiosk frontend.
#
# Serves the built React SPA and reverse-proxies a small, explicit allowlist of backend
# routes under /api/. This allowlist is NOT an authentication layer - the project has none
# yet - it only keeps the public deployment surface limited to the kiosk endpoints the
# frontend actually calls, so admin/CRUD/legacy routes are unreachable from outside the
# Docker network even though the "api" container itself has no auth of its own. See
# deploy/README.md for the full rationale.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, ever.
    autoindex off;

    # Vite never emits .map files for this project (no build.sourcemap config), but refuse
    # to serve any that somehow end up in the image anyway - defense in depth.
    location ~ \.map$ {
        return 404;
    }

    # --- backend upstream -------------------------------------------------------

    # literature-millionaire-api exists only on this project's private "internal" network. The
    # web container is ALSO on the shared reverse-proxy network, where other projects' containers
    # carry generic names; a generic "api" upstream could resolve to one of them. The unique
    # alias can't.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream literature-millionaire-api:8080;

    # --- public API allowlist ----------------------------------------------------
    # Every route the kiosk frontend actually calls, method-restricted, nothing else.
    # Order matters only for the two path-shaped regex locations below; the exact ("=")
    # locations always win regardless of where they appear.

    location = /api/campaigns/current {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/current$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # Category/campaign selection screen (Task 15B): every playable campaign, GET only.
    location = /api/campaigns/available {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/available$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # {campaignId} must be numeric - matches the [int] route constraint on the backend.
    location ~ ^/api/campaigns/(?<campaign_id>[0-9]+)/leaderboard$ {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/$campaign_id/leaderboard$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/game/start {
        if ($request_method != POST) { return 404; }
        proxy_pass http://$api_upstream/api/game/start$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # {sessionId} must be a GUID - matches the [guid] route constraint on the backend.
    # Quoted on purpose: unquoted, Nginx reads the "{" of {8} as the start of the location block
    # and rejects the whole config at startup.
    location ~ "^/api/game/(?<session_id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/(?<game_action>answer|timeout)$" {
        if ($request_method != POST) { return 404; }
        proxy_pass http://$api_upstream/api/game/$session_id/$game_action$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # Everything else under /api/ - Question/Book CRUD, admin, the legacy /api/game/prizes
    # endpoint, anything future - is not public. Same response as a route that never
    # existed, so nothing about the backend's real shape is revealed.
    location /api/ {
        return 404;
    }

    # Optional: lets a host-level monitor check backend DB connectivity without reaching
    # into the Docker network. Carries no gameplay/admin data (see Program.cs's /health).
    location = /health {
        proxy_pass http://$api_upstream/health;
        include /etc/nginx/proxy_params.conf;
    }

    # The admin SPA route is not served in production - same 404 as an unknown route,
    # never index.html, so there is nothing at /admin/... for someone to even discover.
    location ^~ /admin {
        return 404;
    }

    # --- static assets ------------------------------------------------------------

    # Hashed build output (dist/assets/*): the filename changes whenever the content does,
    # so this is safe to cache for a long time and mark immutable.
    #
    # Deliberately a plain prefix match, not "^~ /assets/": with "^~" this would short-circuit
    # nginx's regex-location check entirely, so a stray *.js.map under /assets/ would be
    # served (with cache headers, no less) instead of being caught by the ~ \.map$ block
    # above - regex locations always win over a plain prefix match, but never over "^~".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- SPA ------------------------------------------------------------------------

    # Deep links (/register, /game, /leaderboard/1, ...) must all resolve to index.html so
    # the client-side router can take over after a hard refresh.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
