# Production Nginx config for the kiosk frontend.
#
# Serves the built React SPA and reverse-proxies a small, explicit allowlist of backend
# routes under /api/. This allowlist is NOT an authentication layer - who plays is proven by a QRLog
# sign-in ticket the API checks, and the admin API has no route here at all - it only keeps the public deployment surface limited to the kiosk endpoints the
# frontend actually calls, so admin/CRUD/legacy routes are unreachable from outside the
# Docker network even though the "api" container itself has no auth of its own. See
# deploy/README.md for the full rationale.

# --- real client address and rate limits (http context) ----------------------------------------
#
# Public traffic reaches this container through the QRLog stack's Caddy, so $remote_addr is Caddy's
# address and every visitor would share one rate-limit bucket. Take the client from X-Forwarded-For
# instead - but only trust that header from private-network hops (Caddy, Docker), and walk it from the
# right, so a value a visitor forges at the front of the header is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Limits on the two calls that create server state for nothing: opening a QRLog sign-in (a pending
# login in memory) and starting a quiz. Generous on purpose - a whole office can sit behind one public
# address, and a room of employees starting together must not be turned away. They exist to stop a
# script flooding memory, not to ration people. Polling and QRLog's own signed confirmations are not
# limited: a kiosk polls every 1.5 s, and every confirmation arrives from the one QRLog server.
limit_req_zone $binary_remote_addr zone=qrlog_start:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=game_start:10m rate=30r/m;
# The admin API: a person clicking through a panel, never a flood. Also slows guessing at sign-in.
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No directory listings, ever.
    autoindex off;

    # Vite never emits .map files for this project (no build.sourcemap config), but refuse
    # to serve any that somehow end up in the image anyway - defense in depth.
    location ~ \.map$ {
        return 404;
    }

    # --- backend upstream -------------------------------------------------------

    # literature-millionaire-api exists only on this project's private "internal" network. The
    # web container is ALSO on the shared reverse-proxy network, where other projects' containers
    # carry generic names; a generic "api" upstream could resolve to one of them. The unique
    # alias can't.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream literature-millionaire-api:8080;

    # --- public API allowlist ----------------------------------------------------
    # Every route the kiosk frontend actually calls, method-restricted, nothing else.
    # Order matters only for the two path-shaped regex locations below; the exact ("=")
    # locations always win regardless of where they appear.

    location = /api/campaigns/current {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/current$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # Category/campaign selection screen (Task 15B): every playable campaign, GET only.
    location = /api/campaigns/available {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/available$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # {campaignId} must be numeric - matches the [int] route constraint on the backend.
    location ~ ^/api/campaigns/(?<campaign_id>[0-9]+)/leaderboard$ {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/campaigns/$campaign_id/leaderboard$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/game/start {
        if ($request_method != POST) { return 404; }
        limit_req zone=game_start burst=20 nodelay;
        proxy_pass http://$api_upstream/api/game/start$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # {sessionId} must be a GUID - matches the [guid] route constraint on the backend.
    # Quoted on purpose: unquoted, Nginx reads the "{" of {8} as the start of the location block
    # and rejects the whole config at startup.
    location ~ "^/api/game/(?<session_id>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})/(?<game_action>answer|timeout)$" {
        if ($request_method != POST) { return 404; }
        proxy_pass http://$api_upstream/api/game/$session_id/$game_action$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # "QRLog ilə davam et". Three routes, and one of them is unlike everything else here:
    # /confirm is called by QRLog's SERVER from outside this network, so it has to be reachable
    # publicly. It is safe to expose because it is not trusted - it verifies an HMAC signature
    # against a secret the two services share, and refuses anything it cannot verify. The other
    # two are the kiosk's own, and carry a code that is useless without the poll secret the
    # browser kept.
    location = /api/qrlog-login/start {
        if ($request_method != POST) { return 404; }
        limit_req zone=qrlog_start burst=20 nodelay;
        proxy_pass http://$api_upstream/api/qrlog-login/start$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # The sign-in this browser last started (from a cookie), for a window that has none of the page's own
    # storage - the phone route hands people back to such windows.
    location = /api/qrlog-login/resume {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/qrlog-login/resume;
        include /etc/nginx/proxy_params.conf;
    }

    # Ending it: signing out, handing the phone to the next person, asking for a fresh QR. A sign-in that is
    # never ended is one the next screen resumes - which is what put people in a loop.
    location = /api/qrlog-login/pending {
        if ($request_method != DELETE) { return 404; }
        proxy_pass http://$api_upstream/api/qrlog-login/pending;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/qrlog-login/confirm {
        if ($request_method != POST) { return 404; }
        proxy_pass http://$api_upstream/api/qrlog-login/confirm$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # {code} is the 32 hex characters the backend mints. Quoted for the same reason as the game
    # route above: unquoted, Nginx reads the "{" of {32} as the start of the location block.
    location ~ "^/api/qrlog-login/(?<login_code>[0-9a-fA-F]{32})$" {
        if ($request_method != GET) { return 404; }
        proxy_pass http://$api_upstream/api/qrlog-login/$login_code$is_args$args;
        include /etc/nginx/proxy_params.conf;
    }

    # The admin panel's API (docs/admin-panel-plan.md). Unlike the kiosk routes above it is not an
    # allowlist of paths, because the panel grows - it is safe to pass through because every endpoint
    # under it requires an admin session (an HttpOnly, Secure, SameSite=Strict cookie issued only to a
    # phone on the admin list) and every state-changing call the X-Kitabxana-Admin header. The API
    # checks both; nginx only forwards and rate-limits.
    location /api/admin/ {
        limit_req zone=admin_api burst=60 nodelay;
        # Uploaded pictures travel through here; the API refuses anything over 10 MB with a message of its own.
        client_max_body_size 12m;
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/proxy_params.conf;
    }

    # Everything else under /api/ - Question/Book CRUD, the legacy /api/game/prizes
    # endpoint, anything future - is not public. Same response as a route that never
    # existed, so nothing about the backend's real shape is revealed.
    location /api/ {
        return 404;
    }

    # Optional: lets a host-level monitor check backend DB connectivity without reaching
    # into the Docker network. Carries no gameplay/admin data (see Program.cs's /health).
    location = /health {
        proxy_pass http://$api_upstream/health;
        include /etc/nginx/proxy_params.conf;
    }

    # /admin/... is the admin panel and is served like any other page of the app (the SPA fallback
    # below). The page is not the protection - it shows nothing but a sign-in QR until the API has
    # confirmed an admin session.

    # --- uploaded pictures ----------------------------------------------------------
    #
    # The "uploads" volume the API writes to, mounted read-only (deploy/compose.yml). Only the exact shape the
    # API creates is served - one of two folders, a 32-character hex name, .webp - so nothing else that ever
    # ends up on that volume can be fetched, whatever its name. The name is the hash of the content, so a URL
    # always means the same picture and can be cached forever.
    location ~ "^/uploads/(covers|questions)/[0-9a-f]{32}\.webp$" {
        root /usr/share/nginx;
        default_type image/webp;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /uploads/ {
        return 404;
    }

    # --- static assets ------------------------------------------------------------

    # Hashed build output (dist/assets/*): the filename changes whenever the content does,
    # so this is safe to cache for a long time and mark immutable.
    #
    # Deliberately a plain prefix match, not "^~ /assets/": with "^~" this would short-circuit
    # nginx's regex-location check entirely, so a stray *.js.map under /assets/ would be
    # served (with cache headers, no less) instead of being caught by the ~ \.map$ block
    # above - regex locations always win over a plain prefix match, but never over "^~".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- SPA ------------------------------------------------------------------------

    # Deep links (/register, /game, /leaderboard/1, ...) must all resolve to index.html so
    # the client-side router can take over after a hard refresh.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
